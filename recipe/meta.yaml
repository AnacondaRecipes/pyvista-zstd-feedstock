{% set name = "pyvista-zstd" %}
{% set version = "0.3.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 73fd343171245e9f1d775bddcb049fc871a8a8e96935f5f364d78b4e8e0e2df6

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python
    - pyvista >=0.45.0
    - tqdm >=4.0.0
    - zstandard >=0.24.0

